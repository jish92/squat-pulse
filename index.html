<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Squat pulse v5b</title>
<style>html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#c9ccd1}canvas{display:block;touch-action:none}
#ui{position:fixed;left:8px;bottom:8px;background:rgba(255,255,255,.92);border-radius:10px;padding:8px 10px;font-size:14px;max-width:calc(100vw - 36px);box-shadow:0 1px 6px rgba(0,0,0,.15)}
#ui button{font-size:16px;padding:8px 14px;border-radius:8px;border:1px solid #999;background:#fff;margin-right:6px}
#ui input[type=range]{width:min(220px,48vw);vertical-align:middle}
#ui .row{margin-top:6px}#msg{position:fixed;top:45%;width:100%;text-align:center;font-size:18px;color:#555}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"}}</script></head><body>
<div id="msg">Loading…</div>
<div id="ui">
  <button id="pp">⏸ Pause</button><button id="rs">Reset view</button>
  <div class="row">Speed <input id="spd" type="range" min="0.3" max="2" step="0.05" value="1"> <span id="spdv">1.00</span> /s</div>
  <div class="row">Breast bounce <input id="bb" type="range" min="0" max="1" step="0.05" value="1"> <span id="bbv">1.00</span>×</div>
  <div class="row">Glute bounce <input id="bg" type="range" min="0" max="1" step="0.05" value="1"> <span id="bgv">1.00</span>×</div>
  <div style="font-size:11px;color:#666;margin-top:4px">Drag to orbit · pinch / scroll to zoom</div>
</div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const R=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
R.outputColorSpace=THREE.SRGBColorSpace;R.toneMapping=THREE.ACESFilmicToneMapping;
document.body.prepend(R.domElement);

const S=new THREE.Scene();S.background=new THREE.Color(0xc9ccd1);
S.environment=new THREE.PMREMGenerator(R).fromScene(new RoomEnvironment(),0.04).texture;S.environmentIntensity=0.5;
const C=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,0.05,50);
const O=new OrbitControls(C,R.domElement);O.enableDamping=true;O.minDistance=0.4;O.maxDistance=8;
function home(){const ph=innerWidth<innerHeight;C.position.set(ph?1.15:1.55,ph?1.05:1.0,ph?4.2:3.3);O.target.set(0,0.70,0);O.update()}home();
S.add(new THREE.HemisphereLight(0xffffff,0x8d8a85,1.7));
const dl=new THREE.DirectionalLight(0xffffff,1.9);dl.position.set(3,6,4);dl.castShadow=true;dl.shadow.mapSize.set(2048,2048);
Object.assign(dl.shadow.camera,{left:-2,right:2,top:3,bottom:-1});S.add(dl);
const ground=new THREE.Mesh(new THREE.CircleGeometry(8,64),new THREE.MeshStandardMaterial({color:0xb8bbbf,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;S.add(ground);

// v5b bone bounce: baked 'squat_bounce' clip; strength = per-bone weight blend of bounce tracks vs rest tracks
function boneBounce(mixer,clip,root){
  const isB=n=>/^breast_[lr]\./.test(n), isG=n=>/^glute_[lr]\./.test(n);
  const main=[],bB=[],bG=[],rB=[],rG=[];
  const restTrack=t=>{const bn=t.name.split('.')[0],pr=t.name.split('.')[1];const o=root.getObjectByName(bn);const v=o[pr==='quaternion'?'quaternion':pr==='scale'?'scale':'position'].toArray();
    const T=pr==='quaternion'?THREE.QuaternionKeyframeTrack:THREE.VectorKeyframeTrack;return new T(t.name,[0,clip.duration],v.concat(v))};
  for(const t of clip.tracks){if(isB(t.name)){bB.push(t);rB.push(restTrack(t))}else if(isG(t.name)){bG.push(t);rG.push(restTrack(t))}else main.push(t)}
  const mk=(n,tr)=>{const a=mixer.clipAction(new THREE.AnimationClip(n,clip.duration,tr));a.loop=THREE.LoopRepeat;a.play();return a};
  const A={main:mk('main',main),bB:mk('bB',bB),rB:mk('rB',rB),bG:mk('bG',bG),rG:mk('rG',rG)};
  const all=Object.values(A);
  return {A,
    setB(s){A.bB.setEffectiveWeight(s);A.rB.setEffectiveWeight(1-s)},
    setG(s){A.bG.setEffectiveWeight(s);A.rG.setEffectiveWeight(1-s)},
    setSpeed(v){all.forEach(a=>a.timeScale=v)},
    setPaused(p){all.forEach(a=>a.paused=p)},
    get time(){return A.main.time}, set time(t){all.forEach(a=>a.time=t)}};
}

const W=window;W.sp={ready:false,playing:true,speed:1,breastStr:1,gluteStr:1,errs:[],model:'v5b'};
let mixer=null,BB=null;
const L=new GLTFLoader();
L.load('female_squat_pulse_v5b.glb?v=20261106v5b',gl=>{
  gl.scene.traverse(o=>{
    if(!o.isMesh) return;
    o.castShadow=true; o.frustumCulled=false;
    const mats=Array.isArray(o.material)?o.material:[o.material];
    mats.forEach(m=>{ if(!m) return;
      if(/hair|eyebrow|eyelash|high-poly/i.test(m.name||o.name||'')){m.alphaTest=0.5;m.side=THREE.DoubleSide}
      else {m.alphaTest=0;m.transparent=false;m.opacity=1;m.depthWrite=true}
      if(/Bikini/i.test(m.name||'')){m.side=THREE.DoubleSide;m.roughness=0.55}
      m.needsUpdate=true;});
  });
  S.add(gl.scene);
  let n=0; gl.scene.traverse(o=>{if(o.isMesh&&o.visible)n++}); W.sp.meshes=n;
  const clip=gl.animations.find(a=>a.name==='squat_bounce')||gl.animations[0];
  W.sp.clip=clip.name; W.sp.duration=clip.duration;
  mixer=new THREE.AnimationMixer(gl.scene);
  BB=boneBounce(mixer,clip,gl.scene); BB.setB(W.sp.breastStr); BB.setG(W.sp.gluteStr); BB.setSpeed(W.sp.speed);
  W.sp.BB=BB; W.sp.scene=gl.scene;
  W.sp.seek=t=>{BB.time=((t%1)+1)%1*clip.duration;mixer.update(0)};
  W.sp.ready=true; document.getElementById('msg').textContent='';
},undefined,e=>{W.sp.errs.push(String(e)); document.getElementById('msg').textContent='Load failed'});

const pp=document.getElementById('pp'), spd=document.getElementById('spd');
pp.onclick=()=>{W.sp.playing=!W.sp.playing; if(BB)BB.setPaused(!W.sp.playing); pp.textContent=W.sp.playing?'⏸ Pause':'▶ Play'};
spd.oninput=()=>{W.sp.speed=+spd.value; document.getElementById('spdv').textContent=(+spd.value).toFixed(2); if(BB)BB.setSpeed(W.sp.speed)};
document.getElementById('bb').oninput=e=>{W.sp.breastStr=+e.target.value; document.getElementById('bbv').textContent=(+e.target.value).toFixed(2); if(BB)BB.setB(W.sp.breastStr)};
document.getElementById('bg').oninput=e=>{W.sp.gluteStr=+e.target.value; document.getElementById('bgv').textContent=(+e.target.value).toFixed(2); if(BB)BB.setG(W.sp.gluteStr)};
document.getElementById('rs').onclick=home;
addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight; C.updateProjectionMatrix(); R.setSize(innerWidth,innerHeight)});
const clock=new THREE.Clock();
R.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),0.05); if(mixer&&W.sp.playing)mixer.update(dt); O.update(); R.render(S,C);});
</script></body></html>
